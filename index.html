<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roguelike 無限生存</title>
    <style>
        body {
            background-color: #000;
            color: #ccc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: monospace; 
            overflow: hidden; 
            font-size: 14px; 
        }

        #main-container {
            display: flex; 
            gap: 20px;     
            align-items: flex-start; 
        }

        /* 左側日誌面板樣式 */
        #log-panel {
            width: 250px;
            height: 600px; 
            padding: 10px;
            border: 1px solid #444;
            background-color: #111;
            font-size: 13px;
            overflow: hidden; 
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column; 
        }
        #log-panel div {
            padding: 2px 0;
            border-bottom: 1px dashed #333;
            line-height: 1.4; 
            max-height: 20px; 
            overflow: hidden; 
            flex-shrink: 0; 
        }
        #log-panel h3 {
             flex-shrink: 0; 
             margin-top: 0;
        }

        #game-wrapper {
            display: flex;
            flex-direction: column;
        }

        /* 頂部控制區域 */
        #top-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 10px;
        }

        #reset-player-btn {
            padding: 5px 10px;
            background-color: #4a0000;
            color: #ffaa00;
            border: 1px solid #ffaa00;
            cursor: pointer;
            font-size: 12px;
            border-radius: 3px;
        }
        #reset-player-btn:hover {
             background-color: #6a0000;
        }


        #game-container {
            border: 1px solid #444;
            padding: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
            position: relative; 
        }

        #right-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        #sidebar {
            width: 200px; 
            padding: 10px;
            border: 1px solid #444;
            background-color: #111;
            font-size: 14px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }
        #sidebar p {
            margin: 5px 0;
        }

        #controls {
            padding: 10px;
            border: 1px solid #444;
            background-color: #111;
            text-align: center;
        }

        #dpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr); 
            gap: 5px;
            margin-top: 10px;
        }

        #dpad button {
            width: 50px;
            height: 50px;
            font-size: 20px;
            background-color: #333;
            color: #fff;
            border: 1px solid #666;
            cursor: pointer;
            border-radius: 5px;
            line-height: 1; 
            padding: 0; 
            touch-action: manipulation; 
        }

        #dpad button:active {
            background-color: #555;
        }

        .rot-app {
            user-select: none; 
        }

        /* 遊戲結束畫面樣式 */
        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            color: red;
            display: none; 
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 40px;
            font-weight: bold;
            z-index: 10;
        }
        #game-over-screen button {
            padding: 10px 20px;
            font-size: 20px;
            margin-top: 20px;
            cursor: pointer;
            background-color: #550000;
            color: white;
            border: 2px solid red;
            border-radius: 5px;
        }
    </style>
    
    <script src="https://cdn.jsdelivr.net/npm/rot-js@2/dist/rot.min.js"></script>
    
</head>
<body>
    <div id="main-container">

        <div id="log-panel">
            <h3 style="color: gold; text-align: center;">📜 地城日誌</h3>
        </div>

        <div id="game-wrapper">
             <div id="top-controls">
                 <p>🔄 **當前回合:** <span id="s_turn">0</span> | 🧭 **地圖塊:** (<span id="s_mapX">0</span>, <span id="s_mapY">0</span>)</p>
                 <button id="reset-player-btn" onclick="resetPlayerPosition()">⚠️ 玩家消失？點此重置</button>
            </div>

            <div id="game-container">
                <div id="game-display"></div>
                
                <div id="game-over-screen">
                    <p>GAME OVER</p>
                    <button onclick="restartGame()">重新開始</button>
                </div>
            </div>
        </div>

        <div id="right-panel">
            <div id="sidebar">
                <h3 style="color: gold;">🧑‍💻 玩家狀態</h3>
                <p>等級: <span id="s_level">1</span></p>
                <p>經驗值: <span id="s_exp">0</span> / <span id="s_exp_next">10</span></p>
                <hr>
                <p style="color: red;">HP: <span id="s_hp">10</span> / <span id="s_maxhp">10</span></p>
                <p style="color: orange;">ATK: <span id="s_atk">3</span></p>
                <p style="color: aqua;">DEF: <span id="s_def">1</span></p>
                <hr>
                <p>裝備: <span id="s_equipment">無</span></p>
            </div>

            <div id="controls">
                <h3 style="color: #ccc;">📱 移動控制 (觸控)</h3>
                <div id="dpad">
                    <button data-dir="up-left">↖</button>
                    <button data-dir="up">↑</button>
                    <button data-dir="up-right">↗</button>
                    
                    <button data-dir="left">←</button>
                    <button data-dir="wait">·</button>
                    <button data-dir="right">→</button>
                    
                    <button data-dir="down-left">↙</button>
                    <button data-dir="down">↓</button>
                    <button data-dir="down-right">↘</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 遊戲設定 ---
        const WIDTH = 60;
        const HEIGHT = 30;
        let TILE_MAP = {}; 
        const MAX_LOGS = 30; // 限制日誌數量

        // --- 核心全域變數 ---
        let entities = []; 
        let display = null;
        let fov = null;
        let currentMapX = 0; 
        let currentMapY = 0; 
        let turnCounter = 0; 
        let gameRunning = true; 
        let gameLogs = []; 
        
        // --- 敵人強度顏色對應 ---
        const ENEMY_COLOR_MAP = {
            1: 'red',        // 基礎強度 (玩家等級 1-3)
            2: 'orange',     // 略強 (玩家等級 4-6)
            3: 'yellow',     // 中等強度 (玩家等級 7-9)
            4: 'lime',       // 挑戰 (玩家等級 10-12)
            5: 'cyan',       // 強大 (玩家等級 13+)
        };

        // --- 玩家物件模板 ---
        const PLAYER_TEMPLATE = {
            x: 0, y: 0,
            symbol: '@', color: 'green',
            hp: 10, maxHp: 10,
            attack: 3, defense: 1, 
            level: 1, exp: 0, expToNextLevel: 10, 
            equipment: '無', 
            isPlayer: true
        };
        let player = JSON.parse(JSON.stringify(PLAYER_TEMPLATE)); 

        // --- 1. 初始化遊戲 ---
        function initGame() {
            // 重置所有變數
            currentMapX = 0;
            currentMapY = 0;
            turnCounter = 0;
            gameLogs = [];
            gameRunning = true;
            entities = [];
            player = JSON.parse(JSON.stringify(PLAYER_TEMPLATE));
            
            document.getElementById("game-over-screen").style.display = 'none';

            if (!display) {
                // ROT.Display 設置：使用最穩定的純文字模式
                display = new ROT.Display({
                    width: WIDTH, 
                    height: HEIGHT, 
                    spacing: 1.1, 
                    bg: '#000' 
                });
                document.getElementById("game-display").appendChild(display.getContainer());
            }

            entities.push(player);
            generateMap(0, 0); 
            fov = new ROT.FOV.RecursiveShadowcasting(isPassable);
            
            // 初始生成，使用玩家當前等級作為難度參考 (difficulty = 1)
            generateEntities(player.level); 

            drawScreen();
            updateSidebar(); 
            updateStatusDisplay();
            
            window.addEventListener("keydown", handleKeyInput); 

            const buttons = document.querySelectorAll('#dpad button');
            buttons.forEach(button => {
                if (!button.listenerAdded) {
                    button.addEventListener('click', () => {
                        const dir = button.getAttribute('data-dir');
                        handleInput(null, dir);
                    });
                    button.listenerAdded = true;
                }
            });

            logMessage(`歡迎來到無限地城！`);
        }

        window.restartGame = function() {
            window.removeEventListener("keydown", handleKeyInput);
            initGame();
        }

        function handleKeyInput(e) {
            handleInput(e, null);
        }

        function gameOver() {
            gameRunning = false;
            window.removeEventListener("keydown", handleKeyInput); 
            logMessage(`--- 你的旅程結束了。總回合數: ${turnCounter}，最終等級: ${player.level} ---`);
            document.getElementById("game-over-screen").style.display = 'flex';
        }
        
        // 手動重置玩家位置
        window.resetPlayerPosition = function() {
            if (!gameRunning) return;
            
            const base_x = currentMapX * WIDTH;
            const base_y = currentMapY * HEIGHT;
            const center_x = base_x + Math.floor(WIDTH / 2);
            const center_y = base_y + Math.floor(HEIGHT / 2);

            let found = false;
            // 從中心點開始，向外擴散最多 10 格尋找可通行座標
            for (let i = 0; i < 10; i++) {
                // 嘗試中心點
                if (TILE_MAP[`${center_x},${center_y}`] === '.' && !entities.find(e => e.x === center_x && e.y === center_y && e !== player)) {
                    player.x = center_x;
                    player.y = center_y;
                    found = true;
                    break;
                }
                
                // 嘗試隨機偏移
                const checkX = center_x + ROT.RNG.getUniformInt(-i, i);
                const checkY = center_y + ROT.RNG.getUniformInt(-i, i);
                
                // 確保檢查的點在當前地圖塊的範圍內
                if (checkX >= base_x && checkX < base_x + WIDTH && checkY >= base_y && checkY < base_y + HEIGHT) {
                    if (TILE_MAP[`${checkX},${checkY}`] === '.' && !entities.find(e => e.x === checkX && e.y === checkY && e !== player)) {
                        player.x = checkX;
                        player.y = checkY;
                        found = true;
                        break;
                    }
                }
            }

            if (found) {
                logMessage(`[手動重置] 玩家位置已校正到地圖中心附近。`);
            } else {
                logMessage(`[手動重置] 警告：無法找到可通行位置，玩家被強制放置在中心。`);
                player.x = center_x;
                player.y = center_y;
            }
            
            fov.compute(player.x, player.y, 8, function(){}); 
            drawScreen(true); 
        }

        // --- 2. 地圖生成與邊界檢查 ---

        function generateMap(offsetX, offsetY) {
            TILE_MAP = {}; 
            const digger = new ROT.Map.Digger(WIDTH, HEIGHT);
            
            digger.create(function(x, y, value) {
                const globalX = x + offsetX * WIDTH;
                const globalY = y + offsetY * HEIGHT;
                
                if (value) { TILE_MAP[`${globalX},${globalY}`] = '#'; } else { TILE_MAP[`${globalX},${globalY}`] = '.'; }
            });

            if (offsetX === 0 && offsetY === 0) {
                const rooms = digger.getRooms();
                const startRoom = rooms[0];
                const center = startRoom.getCenter();
                player.x = center[0];
                player.y = center[1];
            }
        }

        // 邊界檢查
        function checkBoundaryAndGenerate() {
            let newMapX = currentMapX;
            let newMapY = currentMapY;
            
            const minX = currentMapX * WIDTH;
            const maxX = (currentMapX + 1) * WIDTH;
            const minY = currentMapY * HEIGHT;
            const maxY = (currentMapY + 1) * HEIGHT;

            // 檢查是否超出當前地圖塊的 X 軸邊界
            if (player.x < minX) { newMapX--; } 
            else if (player.x >= maxX) { newMapX++; }

            // 檢查是否超出當前地圖塊的 Y 軸邊界
            if (player.y < minY) { newMapY--; } 
            else if (player.y >= maxY) { newMapY++; }

            if (newMapX !== currentMapX || newMapY !== currentMapY) {
                
                // 過濾掉舊地圖上的所有非玩家實體
                entities = entities.filter(e => e.isPlayer); 

                const oldMapX = currentMapX;
                const oldMapY = currentMapY;
                currentMapX = newMapX;
                currentMapY = newMapY;
                
                // 重新定位玩家到新地圖塊的對應邊緣，內縮一格
                if (newMapX < oldMapX) {
                    player.x = (currentMapX * WIDTH) + (WIDTH - 1) - 1; 
                } else if (newMapX > oldMapX) {
                    player.x = (currentMapX * WIDTH) + 1; 
                }
                
                if (newMapY < oldMapY) {
                    player.y = (currentMapY * HEIGHT) + (HEIGHT - 1) - 1; 
                } else if (newMapY > oldMapY) {
                    player.y = (currentMapY * HEIGHT) + 1; 
                }
                
                // 檢查新邊緣位置是否可通行
                if (TILE_MAP[`${player.x},${player.y}`] === '#') {
                    player.x = currentMapX * WIDTH + Math.floor(WIDTH / 2);
                    player.y = currentMapY * HEIGHT + Math.floor(HEIGHT / 2);
                }

                generateMap(currentMapX, currentMapY);
                logMessage(`***進入地圖塊 (${currentMapX}, ${currentMapY})。***`);
                
                // 使用當前玩家等級作為新地圖塊的初始難度
                const difficultyLevel = player.level; 
                generateEntities(difficultyLevel); 
                
                updateStatusDisplay();
                return true; 
            }
            return false; 
        }
        
        // --- 3. 動態實體生成與難度控制 ---

        function generateEntities(difficulty) {
            // 難度至少為 1
            const actualDifficulty = Math.max(1, difficulty); 
            
            // 敵人數量隨著難度提高怪物數量
            const numMonsters = 3 + Math.floor(actualDifficulty * 0.5); 
            const numItems = 1 + Math.floor(actualDifficulty * 0.2);

            for (let i = 0; i < numMonsters; i++) { placeMonster(actualDifficulty); }
            for (let i = 0; i < numItems; i++) { placeItem(actualDifficulty); }
        }

        function placeItem(difficulty = 1) {
            const item = {
                x: 0, y: 0, symbol: '!', color: 'yellow', isItem: true,
                boostAmount: 1 + Math.floor(difficulty / 5), 
            };

            const freeCells = Object.keys(TILE_MAP).filter(key => TILE_MAP[key] === '.');
            if (freeCells.length > 0) {
                const index = Math.floor(ROT.RNG.getUniform() * freeCells.length);
                const [x, y] = freeCells[index].split(',').map(Number);
                const entityHere = entities.find(e => e.x === x && e.y === y);
                if (!entityHere) {
                    item.x = x; item.y = y;
                    entities.push(item);
                }
            }
        }

        // 敵人屬性與顏色根據難度等級計算
        function placeMonster(difficulty = 1) {
            // 基礎屬性
            const baseHp = 5;
            const baseAtk = 2;
            const baseDef = 0;
            
            // 屬性成長公式：隨著難度（玩家等級）線性增長
            const monsterHp = baseHp + Math.floor(difficulty * 2.5); 
            const monsterAtk = baseAtk + Math.floor(difficulty * 1.2); 
            const monsterDef = baseDef + Math.floor(difficulty * 0.5); 

            // 顏色標記：根據難度對應 ENEMY_COLOR_MAP
            const colorKeys = Object.keys(ENEMY_COLOR_MAP).map(Number);
            const maxColorKey = colorKeys[colorKeys.length - 1];
            // 將難度級別限制在顏色表的最大值內
            const colorKey = Math.min(maxColorKey, difficulty);
            const monsterColor = ENEMY_COLOR_MAP[colorKey] || 'red';

            const monster = {
                x: 0, y: 0, symbol: 'G', 
                color: monsterColor, // 使用動態顏色
                hp: monsterHp, 
                maxHp: monsterHp, 
                attack: monsterAtk, 
                defense: monsterDef, 
                isPlayer: false,
                level: difficulty // 記錄怪物的生成等級
            };

            const freeCells = Object.keys(TILE_MAP).filter(key => TILE_MAP[key] === '.');
            if (freeCells.length > 0) {
                const index = Math.floor(ROT.RNG.getUniform() * freeCells.length);
                const [x, y] = freeCells[index].split(',').map(Number);

                const entityHere = entities.find(e => e.x === x && e.y === y);
                if (x !== player.x || y !== player.y || !entityHere) {
                    monster.x = x; monster.y = y;
                    entities.push(monster);
                }
            }
        }

        // --- 4. 遊戲邏輯與戰鬥 ---

        function isPassable(x, y) { return TILE_MAP[`${x},${y}`] === '.'; }
        function isWalkable(x, y) {
            if (TILE_MAP[`${x},${y}`] === '#') return false; 
            const entityHere = entities.find(e => e.x === x && e.y === y && e !== this);
            return !entityHere;
        }

        function drawScreen(forceRedraw = false) {
            const offsetX = currentMapX * WIDTH;
            const offsetY = currentMapY * HEIGHT;
            
            // 強制檢查機制：在繪製前確保玩家在當前地圖塊上
            const mapSwitched = checkBoundaryAndGenerate();
            if (mapSwitched) {
                logMessage(`[系統] 偵測到玩家在邊界外，已強制切換地圖。`);
            }

            // 關鍵修正：如果需要強制重繪，則先清空整個顯示器
            if (forceRedraw) {
                display.clear();
            }
            
            // 存儲需要繪製的圖案，以便最後單獨繪製玩家
            const cellsToDraw = {};

            fov.compute(player.x, player.y, 8, function(x, y, r, visibility) {
                const key = `${x},${y}`;
                const tile = TILE_MAP[key] || '#';
                const entityHere = entities.find(e => e.x === x && e.y === y && e !== player); // 排除玩家
                
                const screenX = x - offsetX;
                const screenY = y - offsetY;

                if (screenX < 0 || screenX >= WIDTH || screenY < 0 || screenY >= HEIGHT) return; 

                let symbol, color;

                if (visibility) {
                    symbol = entityHere ? entityHere.symbol : tile;
                    color = entityHere ? entityHere.color : (tile === '#' ? '#888' : '#333');
                    cellsToDraw[`${screenX},${screenY}`] = [symbol, color, '#000'];
                } else {
                    symbol = tile === '#' ? '#' : '.';
                    color = tile === '#' ? '#111' : '#080808';
                    cellsToDraw[`${screenX},${screenY}`] = [symbol, color, '#000'];
                }
            });

            // 繪製所有地圖塊和實體
            for (const key in cellsToDraw) {
                const [screenX, screenY] = key.split(',').map(Number);
                const [symbol, fg, bg] = cellsToDraw[key];
                display.draw(screenX, screenY, symbol, fg, bg);
            }

            // 關鍵修正：單獨繪製玩家，確保其在最頂層且總是被繪製
            const playerScreenX = player.x - offsetX;
            const playerScreenY = player.y - offsetY;

            if (playerScreenX >= 0 && playerScreenX < WIDTH && playerScreenY >= 0 && playerScreenY < HEIGHT) {
                 // 檢查玩家位置是否在視野內 
                let playerVisible = false;
                fov.compute(player.x, player.y, 8, function(x, y, r, visibility) {
                    if (x === player.x && y === player.y) {
                        playerVisible = visibility;
                    }
                });
                
                if (playerVisible || forceRedraw) {
                    display.draw(playerScreenX, playerScreenY, player.symbol, player.color, '#000');
                }
            }
        }
        
        function handleInput(event, dir = null) {
            if (!gameRunning) return;
            
            let dx = 0; let dy = 0;
            if (event) {
                switch (event.key) {
                    case "ArrowUp": case "w": dy = -1; break; case "ArrowDown": case "s": dy = 1; break;
                    case "ArrowLeft": case "a": dx = -1; break; case "ArrowRight": case "d": dx = 1; break;
                    case " ": case ".": case "5": dx = 0; dy = 0; break;
                    default: return; 
                }
                event.preventDefault(); 
            } else if (dir) {
                switch (dir) {
                    case "up": dy = -1; break; case "down": dy = 1; break;
                    case "left": dx = -1; break; case "right": dx = 1; break;
                    case "up-left": dx = -1; dy = -1; break; case "up-right": dx = 1; dy = -1; break;
                    case "down-left": dx = -1; dy = 1; break; case "down-right": dx = 1; dy = 1; break;
                    case "wait": dx = 0; dy = 0; break;
                    default: return;
                }
            } else { return; }

            const playerMoved = attemptMove(player.x + dx, player.y + dy);

            if (playerMoved) { 
                turnCounter++; 
                // 檢查玩家是否在移動/戰鬥中死亡 (雖然這應該在 combat/attemptMove 中處理，但作為安全檢查)
                if (!gameRunning) return; 

                monsterTurn(); 
                
                // 檢查玩家是否在怪物回合中死亡
                if (!gameRunning) return; 
                
                // 額外生成邏輯
                if (turnCounter % 10 === 0) {
                    const difficultyLevel = player.level; 
                    generateEntities(difficultyLevel);
                    logMessage(`難度提升！地城生成額外實體 (Level ${difficultyLevel})。`);
                }
            }
            
            drawScreen();
            updateStatusDisplay();
        }

        function applyItemEffect(item) {
            const statToBoost = ROT.RNG.getUniform() < 0.5 ? 'attack' : 'defense';
            const boostAmount = item.boostAmount;
            
            player[statToBoost] += boostAmount;
            
            logMessage(`你拾取了寶物 (!)。${statToBoost === 'attack' ? '攻擊力' : '防禦力'} +${boostAmount}！`);
            updateSidebar();
        }

        function checkLevelUp() {
            let leveledUp = false;
            while (player.exp >= player.expToNextLevel) {
                player.level += 1; 
                leveledUp = true;
                player.exp -= player.expToNextLevel; 
                player.expToNextLevel = 10 + player.level * 10; 
                
                player.maxHp += 5;
                player.hp = player.maxHp; 
                player.attack += 2;
                player.defense += 1;
                logMessage(`**恭喜！你升級到 Level ${player.level}！** HP+5, ATK+2, DEF+1。`);
            }
            if (leveledUp) { updateSidebar(); }
        }

        function attemptMove(newX, newY) {
            const targetEntity = entities.find(e => e.x === newX && e.y === newY && !e.isPlayer && !e.isItem);
            
            if (TILE_MAP[`${newX},${newY}`] === '#') {
                logMessage(`牆壁擋住了你！`);
                return false;
            }
            
            const targetItem = entities.find(e => e.x === newX && e.y === newY && e.isItem);
            if (targetItem) {
                applyItemEffect(targetItem);
                entities = entities.filter(e => e !== targetItem);
                player.x = newX;
                player.y = newY;
                return true; 
            }

            if (targetEntity) {
                return combat(player, targetEntity); // 戰鬥發生
            }

            player.x = newX;
            player.y = newY;
            updateSidebar();
            logMessage(`你移動了。`);
            return true;
        }

        // 核心機制：判斷實體是否死亡，並執行相應操作
        function checkDeath(entity) {
             if (entity.hp <= 0) {
                entity.hp = 0; 
                if (entity.isPlayer) {
                    updateSidebar();
                    gameOver();
                    return true; // 玩家死亡
                } else {
                    // 敵人死亡，結算經驗值並檢查玩家升級
                    const gainedExp = entity.maxHp; 
                    player.exp += gainedExp;
                    logMessage(`<br>你擊敗了 **Level ${entity.level} ${entity.symbol}**！獲得 ${gainedExp} 點經驗值。`);
                    
                    entities = entities.filter(e => e !== entity);
                    TILE_MAP[`${entity.x},${entity.y}`] = '.'; 
                    
                    checkLevelUp(); // 只有敵人死亡時才檢查升級
                    return true; // 敵人死亡
                }
            }
            return false;
        }

        function combat(attacker, defender) {
            const rawDamage = attacker.attack;
            const defense = defender.defense || 0; 
            
            // 傷害機制修正：確保最低傷害為 1
            const calculatedDamage = rawDamage - defense; 
            const damage = Math.max(1, calculatedDamage); 
            
            defender.hp -= damage;
            
            let logMsg = `**${attacker.symbol} 攻擊 Level ${defender.level} ${defender.symbol}** 造成 ${damage} 點傷害。(${defender.symbol} HP: ${Math.max(0, defender.hp)})`;
            
            
            // 步驟 1: 判斷防禦方 (敵人) 是否死亡
            if (checkDeath(defender)) {
                logMessage(logMsg);
                return true; // 敵人死亡，戰鬥結束，玩家已獲得經驗值
            }

            // 步驟 2: 如果攻擊方是玩家，敵人反擊
            if (attacker.isPlayer) {
                const counterRawDamage = defender.attack;
                const counterDefense = player.defense;
                
                const counterCalculatedDamage = counterRawDamage - counterDefense;
                const counterDamage = Math.max(1, counterCalculatedDamage); 

                player.hp -= counterDamage;
                
                // 步驟 3: 判斷攻擊方 (玩家) 是否死亡
                if (checkDeath(player)) {
                    logMessage(logMsg);
                    return true; // 玩家死亡，遊戲結束
                }
            }
            
            updateSidebar();
            logMessage(logMsg);
            return true; // 戰鬥發生，但沒有實體死亡
        }

        function monsterTurn() {
            const monsters = entities.filter(e => !e.isPlayer && !e.isItem);
            for (const monster of monsters) {
                if (!gameRunning) return; 
                
                const dx = Math.abs(monster.x - player.x);
                const dy = Math.abs(monster.y - player.y);
                
                if (dx <= 1 && dy <= 1) {
                    combat(monster, player); // 怪物攻擊玩家
                    if (!gameRunning) return; // 玩家被怪物擊殺，立即停止怪物行動
                } else {
                    const astar = new ROT.Path.AStar(player.x, player.y, isWalkable.bind(monster), { topology: 8 });
                    const path = [];
                    astar.compute(monster.x, monster.y, function(x, y) { path.push({x, y}); });
                    
                    if (path.length > 1) {
                        const nextStep = path[1];
                        if (isWalkable(nextStep.x, nextStep.y)) {
                            monster.x = nextStep.x;
                            monster.y = nextStep.y;
                        }
                    }
                }
            }
        }

        // --- 5. UI 更新 ---

        function logMessage(message) {
            const timestamp = new Date().toLocaleTimeString('zh-TW', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const logEntry = `<div style="color: ${message.includes('擊敗') ? 'lightgreen' : message.includes('GAME OVER') ? 'red' : message.includes('恭喜') ? 'gold' : 'white'};">[${timestamp}] ${message}</div>`;
            
            gameLogs.push(logEntry);
            
            // 確保日誌數量不超過 MAX_LOGS
            if (gameLogs.length > MAX_LOGS) {
                gameLogs.splice(0, gameLogs.length - MAX_LOGS); 
            }

            const logPanel = document.getElementById("log-panel");
            
            // 將陣列反轉，使最新的日誌顯示在頂部
            const reversedLogs = gameLogs.slice().reverse();
            logPanel.innerHTML = '<h3 style="color: gold; text-align: center;">📜 地城日誌</h3>' + reversedLogs.join('');
        }

        function updateSidebar() {
            document.getElementById("s_level").innerText = player.level;
            document.getElementById("s_exp").innerText = player.exp;
            document.getElementById("s_exp_next").innerText = player.expToNextLevel;
            
            // 讓 HP 條變色，提示玩家危險
            const hpSpan = document.getElementById("s_hp");
            hpSpan.innerText = player.hp;
            if (player.hp / player.maxHp < 0.25) {
                hpSpan.style.color = 'red';
            } else if (player.hp / player.maxHp < 0.5) {
                hpSpan.style.color = 'yellow';
            } else {
                hpSpan.style.color = 'lightgreen';
            }
            
            document.getElementById("s_maxhp").innerText = player.maxHp;
            document.getElementById("s_atk").innerText = player.attack;
            document.getElementById("s_def").innerText = player.defense;
            document.getElementById("s_equipment").innerText = player.equipment;
        }

        function updateStatusDisplay() {
            document.getElementById("s_turn").innerText = turnCounter;
            document.getElementById("s_mapX").innerText = currentMapX;
            document.getElementById("s_mapY").innerText = currentMapY;
        }

        // 啟動遊戲
        window.onload = initGame;
    </script>
</body>
