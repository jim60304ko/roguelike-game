<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roguelike 無限生存</title>
    <style>
        body {
            background-color: #000;
            color: #ccc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: monospace; 
            overflow: hidden; 
            font-size: 14px; 
        }

        #game-wrapper {
            display: flex; 
            gap: 20px;     
            align-items: flex-start; 
        }

        #right-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        #game-container {
            border: 1px solid #444;
            padding: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
        }

        #sidebar {
            width: 200px; 
            padding: 10px;
            border: 1px solid #444;
            background-color: #111;
            font-size: 14px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }
        #sidebar p {
            margin: 5px 0;
        }

        #controls {
            padding: 10px;
            border: 1px solid #444;
            background-color: #111;
            text-align: center;
        }

        #dpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr); 
            gap: 5px;
            margin-top: 10px;
        }

        #dpad button {
            width: 50px;
            height: 50px;
            font-size: 20px;
            background-color: #333;
            color: #fff;
            border: 1px solid #666;
            cursor: pointer;
            border-radius: 5px;
            line-height: 1; 
            padding: 0; 
            touch-action: manipulation; 
        }

        #dpad button:active {
            background-color: #555;
        }

        .rot-app {
            user-select: none; 
        }
    </style>
    
    <script src="https://cdn.jsdelivr.net/npm/rot-js@2/dist/rot.min.js"></script>
    
</head>
<body>
    <div id="game-wrapper">
        <div id="game-container">
            <div id="game-display"></div>
            <p>🗺️ **地城日誌:** <span id="log">載入中...</span></p>
        </div>

        <div id="right-panel">
            <div id="sidebar">
                <h3 style="color: gold;">🧑‍💻 玩家狀態</h3>
                <p>等級: <span id="s_level">1</span></p>
                <p>經驗值: <span id="s_exp">0</span> / <span id="s_exp_next">10</span></p>
                <hr>
                <p style="color: red;">HP: <span id="s_hp">10</span> / <span id="s_maxhp">10</span></p>
                <p style="color: orange;">ATK: <span id="s_atk">3</span></p>
                <p style="color: aqua;">DEF: <span id="s_def">1</span></p>
                <hr>
                <p>裝備: <span id="s_equipment">無</span></p>
            </div>

            <div id="controls">
                <h3 style="color: #ccc;">📱 移動控制 (觸控)</h3>
                <div id="dpad">
                    <button data-dir="up-left">↖</button>
                    <button data-dir="up">↑</button>
                    <button data-dir="up-right">↗</button>
                    
                    <button data-dir="left">←</button>
                    <button data-dir="wait">·</button>
                    <button data-dir="right">→</button>
                    
                    <button data-dir="down-left">↙</button>
                    <button data-dir="down">↓</button>
                    <button data-dir="down-right">↘</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 遊戲設定 ---
        const WIDTH = 60;
        const HEIGHT = 30;
        let TILE_MAP = {}; 

        // --- 核心全域變數 ---
        let entities = []; 
        let display = null;
        let fov = null;
        let currentMapX = 0; // 當前地圖塊的 X 偏移
        let currentMapY = 0; // 當前地圖塊的 Y 偏移
        let turnCounter = 0; // 回合計數器，用於難度控制

        // --- 玩家物件 ---
        let player = {
            x: 0, y: 0,
            symbol: '@', color: 'green',
            hp: 10, maxHp: 10,
            attack: 3, defense: 1, 
            level: 1, exp: 0, expToNextLevel: 10, 
            equipment: '無', 
            isPlayer: true
        };

        // --- 1. 初始化遊戲 ---
        function initGame() {
            display = new ROT.Display({
                width: WIDTH, height: HEIGHT, spacing: 1.1, bg: '#000',
            });
            const gameDisplay = document.getElementById("game-display");
            if (gameDisplay) {
                gameDisplay.appendChild(display.getContainer());
            } else {
                console.error("找不到 game-display 元素！");
                return;
            }
            
            entities.push(player);
            generateMap(0, 0); // 初始生成地圖
            fov = new ROT.FOV.RecursiveShadowcasting(isPassable);
            
            // 初始生成怪物和道具 (難度 1)
            generateEntities(1); 

            drawScreen();
            updateSidebar(); 
            
            window.addEventListener("keydown", (e) => handleInput(e, null)); 

            const buttons = document.querySelectorAll('#dpad button');
            buttons.forEach(button => {
                button.addEventListener('click', () => {
                    const dir = button.getAttribute('data-dir');
                    handleInput(null, dir);
                });
            });

            logMessage(`歡迎來到無限地城！難度將隨著時間遞增。`);
        }

        // --- 2. 地圖生成與邊界檢查 ---

        // 生成地圖 (接受偏移參數)
        function generateMap(offsetX, offsetY) {
            // 每次生成新的地圖塊時，重置 TILE_MAP
            TILE_MAP = {}; 
            // 保留玩家，移除舊地圖上的所有怪物/道具 (無限地城的核心)
            entities = entities.filter(e => e.isPlayer); 

            const digger = new ROT.Map.Digger(WIDTH, HEIGHT);
            
            digger.create(function(x, y, value) {
                // 將局部座標 (0-59, 0-29) 轉換為全域座標
                const globalX = x + offsetX * WIDTH;
                const globalY = y + offsetY * HEIGHT;
                
                if (value) {
                    TILE_MAP[`${globalX},${globalY}`] = '#'; 
                } else {
                    TILE_MAP[`${globalX},${globalY}`] = '.'; 
                }
            });

            // 處理玩家在初始地圖塊的放置 (僅限地圖 0,0)
            if (offsetX === 0 && offsetY === 0) {
                const rooms = digger.getRooms();
                const startRoom = rooms[0];
                const center = startRoom.getCenter();
                player.x = center[0];
                player.y = center[1];
            }
        }

        // 檢查地圖邊界並生成新地圖
        function checkBoundaryAndGenerate() {
            let newMapX = currentMapX;
            let newMapY = currentMapY;

            // 檢查是否超出當前地圖塊的 X 軸邊界
            if (player.x < currentMapX * WIDTH) {
                newMapX--;
            } else if (player.x >= (currentMapX + 1) * WIDTH) {
                newMapX++;
            }

            // 檢查是否超出當前地圖塊的 Y 軸邊界
            if (player.y < currentMapY * HEIGHT) {
                newMapY--;
            } else if (player.y >= (currentMapY + 1) * HEIGHT) {
                newMapY++;
            }

            // 如果地圖區塊發生變化
            if (newMapX !== currentMapX || newMapY !== currentMapY) {
                
                // 1. 更新地圖區塊全域偏移
                currentMapX = newMapX;
                currentMapY = newMapY;
                
                // 2. 重新定位玩家到新地圖塊的對應邊緣 (確保玩家進入新地圖塊)
                if (newMapX !== currentMapX) {
                    player.x = (currentMapX * WIDTH) + (player.x < 0 ? WIDTH - 1 : 0);
                }
                if (newMapY !== currentMapY) {
                    player.y = (currentMapY * HEIGHT) + (player.y < 0 ? HEIGHT - 1 : 0);
                }
                
                // 3. 生成新地圖
                generateMap(currentMapX, currentMapY);
                logMessage(`***進入新的地城區塊 (${currentMapX}, ${currentMapY})。***`);
                
                // 4. 在新地圖上生成怪物和道具，難度基於回合計數
                const difficultyLevel = Math.max(1, Math.floor(turnCounter / 50)); 
                generateEntities(difficultyLevel); 
                
                return true; // 地圖已切換
            }
            return false; // 沒有切換
        }
        
        // --- 3. 動態實體生成與難度控制 ---

        // 根據難度生成怪物和道具
        function generateEntities(difficulty) {
            // 難度等級決定生成數量
            const numMonsters = 3 + Math.floor(difficulty * 1.5);
            const numItems = 1 + Math.floor(difficulty * 0.5);

            for (let i = 0; i < numMonsters; i++) {
                placeMonster(difficulty);
            }
            for (let i = 0; i < numItems; i++) {
                placeItem(difficulty);
            }
        }

        // 隨機放置寶物 (增強道具強度)
        function placeItem(difficulty = 1) {
            const item = {
                x: 0, y: 0,
                symbol: '!', 
                color: 'yellow',
                isItem: true,
                // 儲存道具的增強量 (難度每升 5 級，增強量 +1)
                boostAmount: 1 + Math.floor(difficulty / 5), 
            };

            const freeCells = Object.keys(TILE_MAP).filter(key => TILE_MAP[key] === '.');
            if (freeCells.length > 0) {
                const index = Math.floor(ROT.RNG.getUniform() * freeCells.length);
                const [x, y] = freeCells[index].split(',').map(Number);

                const entityHere = entities.find(e => e.x === x && e.y === y);
                if (!entityHere) {
                    item.x = x;
                    item.y = y;
                    entities.push(item);
                }
            }
        }

        // 隨機放置怪物 (增強敵人強度)
        function placeMonster(difficulty = 1) {
            // 怪物屬性隨難度提升
            const baseHp = 5;
            const baseAtk = 2;
            
            const monsterHp = baseHp + Math.floor(difficulty * 2);
            const monsterAtk = baseAtk + Math.floor(difficulty * 1);

            const monster = {
                x: 0, y: 0,
                symbol: 'G', 
                color: 'red',
                hp: monsterHp,
                maxHp: monsterHp, // 怪物最大生命值用於決定經驗值
                attack: monsterAtk,
                defense: Math.floor(difficulty / 2), // 怪物也有基礎防禦
                isPlayer: false
            };

            const freeCells = Object.keys(TILE_MAP).filter(key => TILE_MAP[key] === '.');
            if (freeCells.length > 0) {
                const index = Math.floor(ROT.RNG.getUniform() * freeCells.length);
                const [x, y] = freeCells[index].split(',').map(Number);

                const entityHere = entities.find(e => e.x === x && e.y === y);
                if (x !== player.x || y !== player.y || !entityHere) {
                    monster.x = x;
                    monster.y = y;
                    entities.push(monster);
                    return;
                }
            }
        }

        // --- 4. 遊戲邏輯與戰鬥 ---

        function isPassable(x, y) { return TILE_MAP[`${x},${y}`] === '.'; }
        function isWalkable(x, y) {
            if (TILE_MAP[`${x},${y}`] === '#') return false; 
            const entityHere = entities.find(e => e.x === x && e.y === y && e !== this);
            return !entityHere;
        }

        function drawScreen() {
            display.clear(); 
            // 視野計算必須使用全域座標
            fov.compute(player.x, player.y, 8, function(x, y, r, visibility) {
                const key = `${x},${y}`;
                const tile = TILE_MAP[key] || '#';
                const entityHere = entities.find(e => e.x === x && e.y === y);
                
                if (visibility) {
                    if (entityHere) {
                        display.draw(x, y, entityHere.symbol, entityHere.color, '#000');
                    } else {
                        let tileColor = tile === '#' ? '#888' : '#333';
                        display.draw(x, y, tile, tileColor, '#000');
                    }
                } else {
                    if (tile === '#') { display.draw(x, y, '#', '#111'); } else if (tile === '.') { display.draw(x, y, '.', '#080808'); }
                }
            });
        }

        function handleInput(event, dir = null) {
            if (player.hp <= 0) { logMessage("你已經死亡了。遊戲結束！"); return; }
            
            let dx = 0;
            let dy = 0;

            // 處理輸入，計算 dx, dy
            if (event) {
                switch (event.key) {
                    case "ArrowUp": case "w": dy = -1; break; case "ArrowDown": case "s": dy = 1; break;
                    case "ArrowLeft": case "a": dx = -1; break; case "ArrowRight": case "d": dx = 1; break;
                    case " ": case ".": case "5": dx = 0; dy = 0; break;
                    default: return; 
                }
                event.preventDefault(); 
            } else if (dir) {
                switch (dir) {
                    case "up": dy = -1; break; case "down": dy = 1; break;
                    case "left": dx = -1; break; case "right": dx = 1; break;
                    case "up-left": dx = -1; dy = -1; break; case "up-right": dx = 1; dy = -1; break;
                    case "down-left": dx = -1; dy = 1; break; case "down-right": dx = 1; dy = 1; break;
                    case "wait": dx = 0; dy = 0; break;
                    default: return;
                }
            } else { return; }

            const playerMoved = attemptMove(player.x + dx, player.y + dy);

            // 每一步都檢查邊界，並增加回合計數器
            const mapSwitched = checkBoundaryAndGenerate(); 
            if (playerMoved) { 
                turnCounter++; 
                monsterTurn(); 
                
                // 每 10 回合嘗試在當前地圖上生成額外的敵人/道具
                if (turnCounter % 10 === 0 && !mapSwitched) {
                    const difficultyLevel = Math.max(1, Math.floor(turnCounter / 50)); 
                    generateEntities(difficultyLevel);
                    logMessage(`難度提升！地城生成額外實體。`);
                }
            }
            drawScreen();
        }

        function applyItemEffect(item) {
            const statToBoost = ROT.RNG.getUniform() < 0.5 ? 'attack' : 'defense';
            const boostAmount = item.boostAmount;
            
            player[statToBoost] += boostAmount;
            
            logMessage(`你拾取了寶物 (!)。${statToBoost === 'attack' ? '攻擊力' : '防禦力'} +${boostAmount}！`);
            updateSidebar();
        }

        function checkLevelUp() {
            let leveledUp = false;
            while (player.exp >= player.expToNextLevel) {
                player.level += 1; 
                leveledUp = true;
                player.exp -= player.expToNextLevel; 
                player.expToNextLevel = 10 + player.level * 10; 
                
                player.maxHp += 5;
                player.hp = player.maxHp; 
                player.attack += 2;
                player.defense += 1;
                logMessage(`**恭喜！你升級到 Level ${player.level}！** HP+5, ATK+2, DEF+1。`);
            }
            if (leveledUp) { updateSidebar(); }
        }

        function attemptMove(newX, newY) {
            const targetEntity = entities.find(e => e.x === newX && e.y === newY && !e.isPlayer && !e.isItem);

            if (TILE_MAP[`${newX},${newY}`] === '#') {
                logMessage(`牆壁擋住了你！`);
                return false;
            }
            
            const targetItem = entities.find(e => e.x === newX && e.y === newY && e.isItem);
            if (targetItem) {
                applyItemEffect(targetItem);
                entities = entities.filter(e => e !== targetItem);
                player.x = newX;
                player.y = newY;
                return true; 
            }

            if (targetEntity) {
                combat(player, targetEntity);
                return true; 
            }

            player.x = newX;
            player.y = newY;
            updateSidebar();
            logMessage(`你移動了。`);
            return true;
        }

        function combat(attacker, defender) {
            const rawDamage = attacker.attack;
            const defense = defender.defense || 0; 
            const damage = Math.max(0, rawDamage - defense); 
            
            defender.hp -= damage;
            
            let logMsg = `**${attacker.symbol} 攻擊了 ${defender.symbol}！造成 ${damage} 點傷害。** (${defender.symbol} HP: ${Math.max(0, defender.hp)})`;
            
            if (defender.hp <= 0) {
                const gainedExp = defender.maxHp; 
                player.exp += gainedExp;

                logMsg += `<br>你擊敗了 ${defender.symbol}！獲得 ${gainedExp} 點經驗值。`;
                
                entities = entities.filter(e => e !== defender);
                TILE_MAP[`${defender.x},${defender.y}`] = '.'; 
                
                checkLevelUp(); 
                logMessage(logMsg);
                return;
            }

            if (attacker.isPlayer) {
                const counterRawDamage = defender.attack;
                const counterDefense = player.defense;
                const counterDamage = Math.max(0, counterRawDamage - counterDefense);

                player.hp -= counterDamage;
                
                logMsg += `<br>${defender.symbol} 反擊了你！你受到了 ${counterDamage} 點傷害。 HP: ${player.hp}/${player.maxHp}`;

                if (player.hp <= 0) {
                    player.hp = 0; 
                    logMsg += `<br>**你被 ${defender.symbol} 擊敗了！遊戲結束。**`;
                    window.removeEventListener("keydown", handleInput);
                }
            }
            updateSidebar();
            logMessage(logMsg);
        }

        function monsterTurn() {
            const monsters = entities.filter(e => !e.isPlayer && !e.isItem);
            for (const monster of monsters) {
                const dx = Math.abs(monster.x - player.x);
                const dy = Math.abs(monster.y - player.y);
                
                if (dx <= 1 && dy <= 1) {
                    combat(monster, player);
                } else {
                    const astar = new ROT.Path.AStar(player.x, player.y, isWalkable.bind(monster), { topology: 8 });
                    const path = [];
                    astar.compute(monster.x, monster.y, function(x, y) { path.push({x, y}); });
                    
                    if (path.length > 1) {
                        const nextStep = path[1];
                        if (isWalkable(nextStep.x, nextStep.y)) {
                            monster.x = nextStep.x;
                            monster.y = nextStep.y;
                        }
                    }
                }
                if (player.hp <= 0) break;
            }
        }

        // --- 5. UI 更新 ---

        function logMessage(message) {
            document.getElementById("log").innerHTML = message;
        }

        function updateSidebar() {
            document.getElementById("s_level").innerText = player.level;
            document.getElementById("s_exp").innerText = player.exp;
            document.getElementById("s_exp_next").innerText = player.expToNextLevel;
            document.getElementById("s_hp").innerText = player.hp;
            document.getElementById("s_maxhp").innerText = player.maxHp;
            document.getElementById("s_atk").innerText = player.attack;
            document.getElementById("s_def").innerText = player.defense;
            document.getElementById("s_equipment").innerText = player.equipment;
        }

        // 啟動遊戲
        window.onload = initGame;
    </script>
</body>
</html>
